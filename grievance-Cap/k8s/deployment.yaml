apiVersion: apps/v1
kind: Deployment
metadata:
  name: grievance-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grievance-backend
  template:
    metadata:
      labels:
        app: grievance-backend
    spec:
      containers:
        - name: grievance-backend
          image: your-dockerhub-username/grievance-backend:latest   # <-- update with your Docker Hub image
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              value: "mongodb://mongo.default.svc.cluster.local:27017/grievance"
---
apiVersion: v1
kind: Service
metadata:
  name: grievance-backend
spec:
  type: LoadBalancer
  selector:
    app: grievance-backend
  ports:
    - port: 80
      targetPort: 3001
